name: Update GitHub Stats Cards

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Find accessible repository owners
        id: owners
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          organizations="$(gh api --paginate user/memberships/orgs --jq '.[].organization.login' | paste -sd, -)"
          echo "value=Klastic${organizations:+,$organizations}" >> "$GITHUB_OUTPUT"

      - name: Generate lifetime contribution card
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_LOGIN: Klastic
        run: node .github/scripts/generate-lifetime-contributions.mjs

      # Requires METRICS_TOKEN with repo, read:user, and read:org scopes.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Klastic&show_icons=true&theme=dark&hide_border=true&include_all_commits=true&owner=${{ steps.owners.outputs.value }}&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: github-stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # Generate top languages card (includes private and org repos via PAT)
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Klastic&layout=compact&theme=dark&hide_border=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: github-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add github-stats.svg github-languages.svg github-lifetime.svg
          git commit -m "chore: update GitHub stats cards" || exit 0
          git pull --rebase
          git push
