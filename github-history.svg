<svg width="540" height="420" viewBox="0 0 540 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Klastic contribution history by year</title>
  <desc id="description">GitHub credited contributions for each year from 2015 through 2026. Blue activity is visible to the workflow and purple activity is restricted private activity.</desc>
  <style>
    .title { fill: #f0f6fc; font: 600 18px "Segoe UI", Ubuntu, sans-serif; }
    .year, .count, .legend { fill: #c9d1d9; font: 400 12px "Segoe UI", Ubuntu, sans-serif; }
  </style>
  <rect x="0.5" y="0.5" width="539" height="419" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="34" class="title">Contribution history by year</text>
  <rect x="24" y="48" width="12" height="12" rx="2" fill="#58a6ff"/>
  <text x="42" y="58" class="legend">Visible</text>
  <rect x="108" y="48" width="12" height="12" rx="2" fill="#bc8cff"/>
  <text x="126" y="58" class="legend">Restricted private</text>
  
  <text x="24" y="87" class="year">2015</text>
  <rect x="70" y="74" width="0" height="17" rx="3" fill="#58a6ff"/>
  <rect x="70" y="74" width="0" height="17" rx="3" fill="#bc8cff"/>
  <text x="516" y="87" text-anchor="end" class="count">1</text>
  <text x="24" y="114" class="year">2016</text>
  <rect x="70" y="101" width="11" height="17" rx="3" fill="#58a6ff"/>
  <rect x="81" y="101" width="0" height="17" rx="3" fill="#bc8cff"/>
  <text x="516" y="114" text-anchor="end" class="count">76</text>
  <text x="24" y="141" class="year">2017</text>
  <rect x="70" y="128" width="31" height="17" rx="3" fill="#58a6ff"/>
  <rect x="101" y="128" width="79" height="17" rx="3" fill="#bc8cff"/>
  <text x="516" y="141" text-anchor="end" class="count">760</text>
  <text x="24" y="168" class="year">2018</text>
  <rect x="70" y="155" width="48" height="17" rx="3" fill="#58a6ff"/>
  <rect x="118" y="155" width="47" height="17" rx="3" fill="#bc8cff"/>
  <text x="516" y="168" text-anchor="end" class="count">656</text>
  <text x="24" y="195" class="year">2019</text>
  <rect x="70" y="182" width="1" height="17" rx="3" fill="#58a6ff"/>
  <rect x="71" y="182" width="48" height="17" rx="3" fill="#bc8cff"/>
