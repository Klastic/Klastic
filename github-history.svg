  <text x="24" y="222" class="year">2020</text>
  <rect x="70" y="209" width="40" height="17" rx="3" fill="#58a6ff"/>
  <rect x="110" y="209" width="0" height="17" rx="3" fill="#bc8cff"/>
  <text x="516" y="222" text-anchor="end" class="count">276</text>
  <text x="24" y="249" class="year">2021</text>
  <rect x="70" y="236" width="26" height="17" rx="3" fill="#58a6ff"/>
  <rect x="96" y="236" width="20" height="17" rx="3" fill="#bc8cff"/>
